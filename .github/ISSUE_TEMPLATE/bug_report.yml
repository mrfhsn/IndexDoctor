name: Bug Report
description: Create a report to help us reproduce and fix an issue
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what happened. Include any error codes returned.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Schema & Query
      description: Provide the schema and query that triggered this behavior (omit sensitive table/column names).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
