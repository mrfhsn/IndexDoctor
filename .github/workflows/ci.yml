name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker-smoke:
    name: Docker Build & Health Check
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t indexdoctor:test .

      - name: Run container
        run: |
          docker run -d --name indexdoctor-test --memory 2g --cpus 1 -p 8080:8080 indexdoctor:test
          sleep 5

      - name: Verify health endpoint
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/api/health/live
          docker logs indexdoctor-test
          docker stop indexdoctor-test
